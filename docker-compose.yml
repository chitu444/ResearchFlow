services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/researchflow
      JWT_SECRET: change-this-in-production
      CLIENT_URL: http://localhost:4173
      UPLOAD_DIR: /app/uploads
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads:
